# ============================================================================
# Descent (1995) - fleet DOSBox base configuration
#
# WHY THIS FILE EXISTS: this title used to ship ONLY its _single.conf, which
# contains just [IPX] and [autoexec]. DOSBox 0.74 fills every unset option from
# its built-in defaults, and the built-in default is fullscreen=false - so the
# game came up in a small window on a 1920x1080 desktop and there was no way to
# change that from the staged tree. Modelled on Carmageddon1/dosboxCarma.conf,
# which is the pattern already verified on this fleet.
#
# The launcher passes BOTH confs, base first:
#   DOSBox.exe -conf "..\<this file>" -conf "..\<title>_single.conf"
# Later -conf files win on duplicate keys, which is why [autoexec] lives in the
# _single conf and the display settings live here.
#
# fullresolution: "original" changes the display to the game's own mode and is
# what the 4:3 CRT boxes want. On a 1920x1080 panel "desktop" may fill better.
# If a box reports a window or a black screen, try in this order:
#   output=ddraw -> output=surface -> fullresolution=desktop
# ============================================================================

[sdl]
fullscreen=true
fulldouble=false
fullresolution=desktop
windowresolution=original
output=ddraw
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper.txt
usescancodes=true

[dosbox]
language=
machine=svga_s3
# Ctrl+F5 writes a PNG here. The path is relative to the DOSBOX directory the
# launcher cd's into, so this resolves to C:\Games\<Title>\captures - which is
# where a box agent should DOWNLOAD screenshots from. DOSBox creates it.
captures=..\captures
memsize=32

[render]
frameskip=0
aspect=true
scaler=normal2x

[cpu]
core=dynamic
cycles=max
cycleup=1000
cycledown=1000

[mixer]
nosound=false
rate=44100
blocksize=2048
prebuffer=40

[midi]
mpu401=intelligent
device=default
config=

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
mixer=true
oplmode=auto
oplrate=44100

[gus]
gus=false
gusrate=22050
gusbase=240
irq1=5
irq2=5
dma1=3
dma2=3
ultradir=C:\ULTRASND

[speaker]
pcspeaker=true
pcrate=22050
tandy=auto
tandyrate=22050
disney=true

[joystick]
joysticktype=auto
timed=true
autofire=false
swap34=false
buttonwrap=true

[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled

[dos]
xms=true
ems=true
umb=true
keyboardlayout=none


[IPX]
ipx=true

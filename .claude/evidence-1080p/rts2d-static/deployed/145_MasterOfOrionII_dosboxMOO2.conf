# Master of Orion II - fleet BASE DOSBox conf.
#
# [sdl] fullresolution is REWRITTEN PER BOX by the launcher through FLEETRES
# (-ini ... sdl fullresolution %FR_DOSFULLRES%). It cannot be a staged
# constant: `original` retargets the WHOLE DESKTOP on an LCD and `desktop` is
# wrong on a CRT, and this fleet has four of each.
[sdl]
fullscreen=true
fulldouble=false
fullresolution=desktop
windowresolution=original
output=surface
autolock=true
sensitivity=100
waitonerror=true
priority=higher,normal
mapperfile=mapper.txt
usescancodes=true

[dosbox]
machine=svga_s3
memsize=32

[render]
frameskip=0
aspect=true
scaler=normal2x

[cpu]
core=auto
cputype=auto
cycles=max
cycleup=500
cycledown=20

[sblaster]
sbtype=sb16
sbbase=220
irq=7
dma=1
hdma=5
mixer=true
oplmode=auto
oplrate=22050

[ipx]
ipx=false

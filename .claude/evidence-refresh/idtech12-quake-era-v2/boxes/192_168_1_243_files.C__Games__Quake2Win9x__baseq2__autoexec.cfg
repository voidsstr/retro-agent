// autoexec.cfg - fleet defaults for Quake II
//
// Quake II shipped in 1997 with arrow-key movement and mouse-look OFF, which is
// unplayable to anyone who learned FPS controls after about 1999. Quake II runs
// this file at startup AFTER config.cfg, so these win over whatever the engine
// last wrote when it quit - which is why the bindings live here rather than in
// config.cfg, where the game would overwrite them on exit.

// ---- movement: WASD, plus F ------------------------------------------------
unbindall
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind f "invuse"                 // Quake II has no +use; invuse is its action key
bind SPACE "+moveup"            // jump
bind CTRL "+movedown"           // crouch
bind SHIFT "+speed"

// ---- free look -------------------------------------------------------------
// Quake II has no `freelook` cvar - +mlook IS the mechanism, and putting it in
// autoexec is what makes it permanent rather than a key you have to hold.
+mlook
set lookstrafe "0"              // mouse left/right TURNS, it does not strafe
set lookspring "0"              // do not snap the view back when you stop moving
set m_pitch "0.022"             // stock sensitivity, not inverted
set sensitivity "5"
set cl_run "1"                  // always run; nobody wants 1997 walk speed

// ---- weapons and the rest --------------------------------------------------
bind MOUSE1 "+attack"
bind MOUSE2 "+moveup"
bind MWHEELUP "weapnext"
bind MWHEELDOWN "weapprev"
bind q "weapprev"
bind e "weapnext"
bind TAB "inven"
bind r "cmd help"
bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind t "messagemode"
bind y "messagemode2"
bind F5 "save quick"
bind F9 "load quick"

// ---- fleet 2026-08-29: fullscreen + a screenshot key ------------------------
// Quake II execs autoexec.cfg (FS_ExecAutoexec) BEFORE VID_Init, so setting
// vid_fullscreen here is read by the video system on startup. config.cfg is
// rewritten on exit, which is why this lives in autoexec.cfg.
set vid_fullscreen "1"
// F11 writes baseq2\scrnshot\quakeXX.tga (or .pcx on the software renderer),
// which the agent can DOWNLOAD. The agent's own SCREENSHOT is a GDI BitBlt and
// returns a black frame for a fullscreen game.
bind F11 "screenshot"

// ---- renderer: OpenGL, not the 320x240 software one -------------------------
// Quake II defaults to vid_ref "soft" at 320x240 when nothing says otherwise,
// which is what the fleet was actually getting. ref_gl.dll ships in this tree.
// autoexec.cfg is exec-ed before VID_Init, so these are read at startup.
// If a box's OpenGL is broken the engine falls back to ref_soft on its own.
set vid_fullscreen "1"

// ---- per-box resolution ---------------------------------------
// fleetres.cfg is written by this title's Play ....bat at every
// launch, from the panel FLEETRES.EXE measures on THIS machine.
// It is exec'd LAST so it beats anything set above, and it is not
// shipped in the library - one staged tree serves eight different
// monitors, so a resolution constant here is wrong somewhere by
// construction. If the file is absent the engine prints a harmless
// 'couldn't exec' and keeps its own defaults.
// The renderer (vid_ref, gl_driver, gl_mode / sw_mode) is NOT set here: each
// launcher writes it into fleetres.cfg at every start - Play Quake II.bat the
// software renderer, Play Quake II - Voodoo.bat the 3dfx MiniGL (3dfxgl.dll).
exec fleetres.cfg


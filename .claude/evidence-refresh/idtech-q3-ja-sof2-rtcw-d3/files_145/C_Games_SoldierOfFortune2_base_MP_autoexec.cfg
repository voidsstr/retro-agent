// Fleet autoexec.cfg - Soldier of Fortune II MULTIPLAYER (sof2mp.exe).
//
// *** WHY THIS FILE EXISTS, AND WHY base\autoexec.cfg IS NOT ENOUGH. ***
// PROVEN ON HARDWARE 2026-08-30 on .123, not reasoned from the tree:
//
//   sof2mp.exe's game directory is base/MP, NOT base. So the fleet config
//   staged at base\autoexec.cfg HAD NEVER APPLIED TO MULTIPLAYER AT ALL -
//   not the PunkBuster switches, not the binds, not the resolution, not the
//   exec of fleetres.cfg. Every one of them was silently inert, and the game
//   started and played perfectly, which is exactly why nobody caught it.
//
// The proof was a single controlled swap: an autoexec.cfg placed in base\
// with "seta r_mode 8" changed nothing and the game stayed at 640x480; the
// SAME file placed in base\MP\ brought it up at 1280x1024. The engine also
// writes its own config to base\MP\sof2mp.cfg, which independently confirms
// base/MP is the live game directory. The CD key path already told us this -
// the binary does CL_ReadCDKey("base/mp") + "%s/sof2key" - but nobody carried
// that fact across to the config.
//
// SINGLE PLAYER (SoF2.exe) still reads base\autoexec.cfg. Two binaries, two
// game directories, so the fleet settings have to be staged in both. This
// file shadows base\autoexec.cfg for MP - fs_game is searched before
// fs_basegame - so it must carry everything MP needs on its own.
//
// exec fleetres.cfg still resolves from base\ through the search path
// (verified: r_mode 7 written to base\fleetres.cfg came up 1152x864 with
// only "exec fleetres.cfg" in this file), so the launcher does NOT need to
// change where it writes that file.

seta r_colorbits "32"
seta com_maxfps "125"

// BRIGHTNESS (2026-09-28, the V5 6000 on .124: "very dark"). SoF2's engine
// default is r_overBrightBits 0 - unlike Quake III's 1 - and with 0 it loads an
// IDENTITY gamma ramp through the hardware gamma path, replacing the brighter
// ramp the driver had in the DAC, and never brightens the lightmaps in
// software either (sof2mp.exe 0x4a7400 returns them unchanged). 1 makes the
// ramp double the lightmapped world, as Quake III does. Harmless where the
// card has no hardware gamma: the engine forces overbright to 0 there.
// The startup log's "GAMMA: ... 0 overbright bits" line is printed BEFORE
// the engine computes the value (GfxInfo_f runs ahead of R_InitImages), so it
// always says 0 - type gfxinfo in game to read the real value.
seta r_overBrightBits "1"
// r_picmip 2 is only the engine's own default (Cvar_Get("r_picmip", "2")),
// which quarters every texture; every fleet card has the memory for 0.
seta r_picmip "0"

// SCREENSHOT: the agent's SCREENSHOT is a GDI BitBlt and returns a black
// frame for a fullscreen game, so use the engine's own capture. Files land in
// base\MP\screenshots\.
bind F11 "screenshotJPEG"
bind F10 "screenshot"

// -- CD KEY: nothing to set here. cl_cdkey is CVAR_ROM and the engine fills
//    it during Com_Init from base\MP\sof2key, which IS staged. Neither a
//    "seta cl_cdkey" nor a "+set cl_cdkey" has any effect - both were tried
//    on hardware and both are no-ops.

// -- PunkBuster OFF at both ends. This is an isolated LAN with no route to the
//    PunkBuster master server, and a client that cannot fetch a PB update gets
//    kicked out of its own game. NOTE: until this file existed these two lines
//    lived only in base\autoexec.cfg and therefore never reached multiplayer,
//    which is the half of the game PunkBuster actually affects.
seta cl_punkbuster "0"
seta sv_punkbuster "0"

// -- RESOLUTION: r_mode -1 DOES NOT WORK IN THIS ENGINE. r_customwidth,
//    r_customheight and r_customaspect are registered as cvars, so they look
//    supported, but this renderer has no mode -1 branch: setting r_mode -1
//    with r_customwidth 1920 / r_customheight 1080 falls back to 640x480,
//    measured twice on .123. Only the MODE INDEX works. The table, from
//    sof2mp.exe's own strings:
//        0 320x240   1 400x300   2 512x384   3 640x480   4 800x600
//        5 960x720   6 1024x768  7 1152x864  8 1280x1024 9 1600x1200
//       10 2048x1536 11 856x480 (wide)
//    There is NO 1920x1080 entry, and the only widescreen mode is 856x480.
//    So on a 1080p panel the best this engine can do is MODE 8 (1280x1024) -
//    9 and 10 are taller than 1080 and will not fit. 1920x1080 is genuinely
//    NOT ATTAINABLE for SoF2; that is an engine limit, not a staging gap.
// ---- per-box resolution ---------------------------------------
// fleetres.cfg is written by this title's Play ....bat at every launch into
// base\, from the panel FLEETRES.EXE measures on THIS machine, and is found
// from here through the search path. It is exec'd LAST so it beats anything
// set above, and it is not shipped in the library - one staged tree serves
// eight different monitors, so a resolution constant here is wrong somewhere
// by construction.
exec fleetres.cfg

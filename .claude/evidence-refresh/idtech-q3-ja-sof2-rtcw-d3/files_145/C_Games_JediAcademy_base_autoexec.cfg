// Fleet autoexec.cfg - Jedi Knight: Jedi Academy (Quake III engine).
// jaconfig.cfg / jampconfig.cfg are rewritten on exit; this file is not.
// Engine screenshot - the agent's GDI capture is black for a fullscreen game.
// Files land in base\screenshots\.
bind F11 "screenshotJPEG"
bind F10 "screenshot"

// ---- per-box resolution ---------------------------------------
// fleetres.cfg is written by this title's Play ....bat at every
// launch, from the panel FLEETRES.EXE measures on THIS machine.
// It is exec'd LAST so it beats anything set above, and it is not
// shipped in the library - one staged tree serves eight different
// monitors, so a resolution constant here is wrong somewhere by
// construction. If the file is absent the engine prints a harmless
// 'couldn't exec' and keeps its own defaults.
exec fleetres.cfg

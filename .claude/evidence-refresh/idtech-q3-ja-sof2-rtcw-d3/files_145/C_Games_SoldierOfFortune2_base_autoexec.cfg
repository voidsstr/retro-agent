// Fleet autoexec.cfg - Soldier of Fortune II: Double Helix (Gold).
//
// *** THIS FILE IS SINGLE PLAYER ONLY (SoF2.exe). ***
// sof2mp.exe's game directory is base/MP, not base, so NOTHING in this file
// reaches multiplayer - proven on hardware 2026-08-30 on .123 by placing the
// same 'seta r_mode 8' in base\ (no effect, stayed 640x480) and then in
// base\MP\ (came up 1280x1024). The engine writes its own config to
// base\MP\sof2mp.cfg, which confirms it. The MP settings therefore live in
// base\MP\autoexec.cfg - EDIT BOTH, or an MP change will silently do nothing.
//
// Also recorded there: r_mode -1 with r_customwidth/r_customheight DOES NOT
// WORK in this engine - it falls back to 640x480. Only the mode index works,
// and the table has no 1920x1080, so mode 8 (1280x1024) is the ceiling on a
// 1080p panel.
//
// SoF2 is the Quake III Team Arena engine, so the fleet's existing idTech
// mechanisms apply unchanged: the engine execs default.cfg, then its own
// config, then autoexec.cfg, all before the renderer starts - so r_fullscreen
// set here is what it comes up with, and the engine never writes this file
// back on exit the way it rewrites its own config.
seta r_colorbits "32"
seta com_maxfps "125"

// SCREENSHOT: the agent's SCREENSHOT is a GDI BitBlt and returns a black frame
// for a fullscreen game, so use the engine's own capture. Files land in
// base\screenshots\.
bind F11 "screenshotJPEG"
bind F10 "screenshot"

// -- CD KEY: NOT SET HERE, AND IT CANNOT BE. cl_cdkey is CVAR_ROM and the
//    engine fills it during Com_Init from the file
//        base\MP\sof2key
//    (CL_ReadCDKey("base/mp") then FS_SV_FOpenFileRead of "%s/sof2key"). So
//    neither a "seta cl_cdkey" here nor a "+set cl_cdkey" on the command line
//    has any effect - both were tried on hardware and both are no-ops. The
//    seta line that used to sit here did nothing; it is removed so nobody
//    re-derives a wrong conclusion from its presence.
//    Key format + checksum rule: see
//    "Play Soldier of Fortune II - Multiplayer.bat".

// -- PunkBuster OFF at both ends. This is an isolated LAN with no route to the
//    PunkBuster master server, and a client that cannot fetch a PB update gets
//    kicked out of its own game. Nothing on this fleet wants PB.
seta cl_punkbuster "0"
seta sv_punkbuster "0"

// -- r_mode note: 6 = 1024x768, which matches the fleet desktops and the
//    GeForce 6800 / Radeon 9800 XT / HD 3850 / Ti 4600 boxes comfortably. If a
//    weak box (.171's Intel 865G, .124's GeForce2) struggles, set r_mode 4
//    (800x600) in THAT BOX's own base\sof2.cfg - not here, because here is the
//    copy every machine gets.

// ---- per-box resolution ---------------------------------------
// fleetres.cfg is written by this title's Play ....bat at every
// launch, from the panel FLEETRES.EXE measures on THIS machine.
// It is exec'd LAST so it beats anything set above, and it is not
// shipped in the library - one staged tree serves eight different
// monitors, so a resolution constant here is wrong somewhere by
// construction. If the file is absent the engine prints a harmless
// 'couldn't exec' and keeps its own defaults.
exec fleetres.cfg

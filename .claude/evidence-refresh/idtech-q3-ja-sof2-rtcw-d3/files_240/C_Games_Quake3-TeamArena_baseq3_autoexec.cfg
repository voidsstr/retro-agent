// Fleet autoexec.cfg - Quake III Arena / Team Arena.
// Q3 execs default.cfg, then q3config.cfg, then autoexec.cfg, all during
// Com_Init and before the renderer starts - so r_fullscreen set here is what
// the renderer comes up with. q3config.cfg is rewritten on exit; this is not.
//
// Works for BOTH binaries in this tree: retail quake3.exe reads it from the
// install directory, and ioquake3.x86.exe (which writes its own config to
// %APPDATA%\Quake3\baseq3\) still finds it on the search path.
seta r_colorbits "32"
seta com_maxfps "125"

// SCREENSHOT: the agent's SCREENSHOT is a GDI BitBlt and gives a black frame
// for a fullscreen game, so use the engine's own capture.
//   F11 -> JPEG (small, quick to DOWNLOAD)
//   F10 -> TGA  (lossless, if the JPEG one is not compiled in)
// ioquake3 writes to %APPDATA%\Quake3\<mod>\screenshots\;
// retail quake3.exe writes to <install>\<mod>\screenshots\.
bind F11 "screenshotJPEG"
bind F10 "screenshot"

// ---- per-box resolution ---------------------------------------
// fleetres.cfg is written by this title's Play ....bat at every
// launch, from the panel FLEETRES.EXE measures on THIS machine.
// It is exec'd LAST so it beats anything set above, and it is not
// shipped in the library - one staged tree serves eight different
// monitors, so a resolution constant here is wrong somewhere by
// construction. If the file is absent the engine prints a harmless
// 'couldn't exec' and keeps its own defaults.
exec fleetres.cfg


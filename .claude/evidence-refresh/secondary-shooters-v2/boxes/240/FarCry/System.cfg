-- Far Cry - fleet staged engine configuration TEMPLATE.
--
-- EVERY VALUE IS QUOTED, and that is not a style choice. Far Cry writes its
-- own config that way - its configurator emits sys_firstlaunch = "1",
-- e_decals = "1" - and a BARE value is not parsed at all. Measured on .246:
-- with r_Fullscreen = 1 and sys_firstlaunch = 0 unquoted, the engine ignored
-- the whole file, so the first-run wizard was NOT suppressed and the launch
-- stopped dead on a modal "Auto detection will adjust settings for optimal
-- performance!" dialog. Nothing reported an error; the settings simply did
-- not exist. Do not unquote these.
--
-- THIS FILE IS THE TEMPLATE, NOT THE LIVE CONFIG. Far Cry REWRITES System.cfg
-- when it exits, so anything pinned in the live file is lost the first time
-- somebody changes a setting in-game, and no redeploy of the library ever
-- corrects it. Play Far Cry.bat copies this over System.cfg on EVERY launch
-- and only then lets FLEETRES write the resolution, which is what makes
-- fullscreen a property of the shortcut rather than of whatever state the box
-- was left in.
--
-- The r_Width/r_Height below are the FALLBACK ONLY - the values a box gets if
-- FLEETRES.EXE is missing or its panel is unreadable. 1024x768 is the fleet
-- lowest common denominator, not a preference. A box with a readable panel
-- gets its own native mode instead, measured at launch. Do not "fix" these
-- numbers upward: a mode a panel cannot do is a mode-set failure, not a
-- smaller picture.
r_Driver = "Direct3D9"
r_Fullscreen = "1"
r_Width = "1920"
r_Height = "1080"
r_ColorBits = "32"
r_DepthBits = "24"
sys_firstlaunch = "0"

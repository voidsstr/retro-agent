// retro-benchmark : Quake III Arena timedemo config (auto-generated per run)
// placeholders substituted by benchmark_runner.py: {width} {height} {colordepth} {depthbits} {tag} {demo}
seta com_maxfps "0"
seta cl_avidemo "0"
seta r_mode "-1"
seta r_customwidth "{width}"
seta r_customheight "{height}"
seta r_colorbits "{colordepth}"
seta r_depthbits "{depthbits}"
seta r_texturebits "{colordepth}"
seta r_stencilbits "0"
seta r_fullscreen "1"
seta r_swapInterval "0"
seta r_picmip "0"
seta r_ext_compress_textures "0"
seta r_vertexLight "0"
seta cg_drawFPS "1"
vid_restart
demo {demo}
condump bench_{tag}.log
quit

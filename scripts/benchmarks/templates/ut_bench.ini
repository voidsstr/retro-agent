; retro-benchmark : Unreal-engine (UT / Deus Ex) render + resolution overrides.
; Only the keys the benchmark cares about are set here; the runner writes this as
; a -ini= override so the user's real UnrealTournament.ini is never touched.
; placeholders: {width} {height} {colordepth} {renderdevice}
;
; API selection is the whole point per card:
;   Voodoo5      -> render_device = Glide (SoftDrv.GlideRenderDevice / Glide2/3)
;   GeForce4     -> render_device = D3D   (D3DDrv.D3DRenderDevice)
; The runner fills {renderdevice} from the card profile.

[Engine.Engine]
GameRenderDevice={renderdevice}
Console=Engine.Console
Language=int

[WinDrv.WindowsClient]
FullscreenViewportX={width}
FullscreenViewportY={height}
FullscreenColorBits={colordepth}
WindowedViewportX={width}
WindowedViewportY={height}
StartupFullscreen=True
UseJoystick=False

[D3DDrv.D3DRenderDevice]
UseVSync=False
Use32BitTextures={use32}
DescFlags=0

[Glide2Drv.Glide2RenderDevice]
UseVSync=False

[GlideDrv.GlideRenderDevice]
UseVSync=False

// retro-benchmark : Serious Sam (TFE) benchmark script (auto-generated per run)
// Executed via  SeriousSam.exe +exec bench.ini
// placeholders: {width} {height} {colordepth} {demo} {tag} {api}
//
// api -> sam_iGfxAPI : 0 = OpenGL, 1 = Direct3D. Voodoo/GeForce both run OpenGL
// well; use D3D as the alt path.
sam_bAutoAdjustAudio=0;
sam_iGfxAPI={api};
sam_bFullScreenActive=1;
sam_iScreenSizeI={width};
sam_iScreenSizeJ={height};
sam_iDisplayDepth={colordepth};
sam_bWaitForVSync=0;
dem_bProfile=1;
dem_iProfileCPU=0;
dem_bOnScreenDisplay=1;
// play the standard recorded demo and dump timing, then quit
StartDemoPlay("Demos\\{demo}", 0, 0);
// dem_bProfile logs avg/min/max sustained fps to the console/log which the
// runner scrapes into bench_result.txt

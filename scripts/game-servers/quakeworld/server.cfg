sv_progtype 1
gamedir ktx
hostname "NSC Retro Fleet Arena (QuakeWorld)"
maxclients 16
maxspectators 6
rcon_password "retroadmin"
timelimit 10
fraglimit 30
setmaster master.quakeworld.nu:27000 master.quakeservers.net:27000 qwmaster.ocrana.de:27000 asgaard.morphos-team.net:27000

// ---- bots: KTX frogbots (install-ktx-bots.sh) -----------------------------
// (No semicolons in these comments: mvdsv splits a line at one and refuses
// to run the rest, logging a "security hole" warning.)
// The fleet rule: backfill to 3 players, Hard. KTX adds a bot while fewer than
// k_fb_autoadd_limit clients are on and removes the lowest-scoring one above
// k_fb_autoremove_at - but ONLY while at least one human is connected, so an
// idle server is empty. Skill is 0..20 and 15 is the fleet's "Hard" (the 4th of
// 5 rungs from the easiest, like YaPB 3 and Quake III's Hardcore).
set k_fb_enabled 1
set k_fb_autoadd_limit 3
set k_fb_autoremove_at 3
set k_fb_skill 15
set k_defmap dm4

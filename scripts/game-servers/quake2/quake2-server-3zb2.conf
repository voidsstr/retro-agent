# Drop-in for quake2-server.service, installed by install-3zb2.sh into
# ~/.config/systemd/user/quake2-server.service.d/3zb2.conf
#
# Yamagi looks for game.so next to its OWN BINARY before it looks in -datadir,
# so the packaged /usr/lib/yamagi-quake2/quake2 always loads the packaged
# /usr/lib/yamagi-quake2/baseq2/game.so and a 3zb2 game.so in the datadir is
# never used (measured 2026-10-01: serverinfo kept gamedate "Sep 17 2025").
# Running a COPY of the same binary from ~/q2-server makes ~/q2-server/baseq2
# the binary-adjacent dir. The copy does not follow apt upgrades: re-run
# install-3zb2.sh after upgrading yamagi-quake2.
#
# stdbuf -oL: stdout is a file here, so without it the console (bots entering,
# rcon, map changes) reaches server.log only in 4 KB blocks - the log of the
# current map could not be read at all.
[Service]
ExecStart=
ExecStart=/usr/bin/stdbuf -oL -eL /home/voidsstr/q2-server/quake2 -datadir /home/voidsstr/q2-server +set dedicated 1 +exec server.cfg

// Yamagi Quake 2 Dedicated Server - NSC Retro Fleet
// NO SEMICOLONS IN COMMENTS: the command buffer splits a line at a semicolon
// before it strips the comment, so the rest of the line runs as a command.
// Installed by install-3zb2.sh into BOTH ~/.yq2/baseq2/ (what Yamagi reads)
// and ~/q2-server/baseq2/ (kept in sync). Edit here, re-run the installer.
set hostname "NSC Retro Fleet Arena (Q2)"
set maxclients 12
set fraglimit 25
set timelimit 15
set deathmatch 1
set coop 0
set dmflags 272
set public 1
set rcon_password "retroadmin"

// Community master uplinks (Yamagi's default includes master.yamagi.org)
setmaster master.quakeservers.net master.q2servers.com

// Bots - 3rd Zigock Bot II (3zb2), the game.so in ~/q2-server/baseq2.
// zb_path is where its data lives, relative to the working directory. It is
// NOT the gamedir, so clients stay in baseq2 with nothing to download.
// "fleet" is the 3-bot Hard section install-3zb2.sh appends to 3ZBConfig.cfg,
// and autospawn 1 brings those bots in at every map. The count is FIXED:
// 3zb2 has no backfill, so humans join beside the bots (live: rcon "sv spb N"
// adds N, "sv rmb N" removes N).
set zb_path "3zb2"
set botlist "fleet"
set autospawn 1
set chedit 0
set zigmode 0

// Rotation: 3zb2's game module does not read sv_maplist - it takes the next
// map from the [q2dmx] section of 3zb2/3ZBMAPS.LST (q2dm1..q2dm8, the same
// rotation sv_maplist held). sv_maplist is kept for Yamagi's own game.so.
set maplist "q2dmx"
set sv_maplist "q2dm1 q2dm2 q2dm3 q2dm4 q2dm5 q2dm6 q2dm7 q2dm8"
map q2dm1

// NSC Retro Fleet - Half-Life Deathmatch (GoldSrc "valve" mod)
//
// WHY THIS SERVER EXISTS, AND WHICH CLIENT CAN REACH IT
// -----------------------------------------------------
// The fleet's staged HalfLife1 tree is the WON build and speaks network
// protocol 45 - it CANNOT join this (or any) modern HLDS, which is protocol
// 48. Measured 2026-08-31: the WON client refuses with "This server is using
// a newer protocol ( 48 ) than your client ( 45 )".
//
// The client that CAN join is the CounterStrike16 tree's engine, which is the
// Steam-era build and already ships a complete valve\ mod directory with no
// maps - it downloads them from here. Verified in-game on .171, crossfire.
//   hl.exe -game valve -full +connect 192.168.1.132:27020
hostname "NSC Retro Fleet - Half-Life Deathmatch"
rcon_password "retroadmin"
sv_lan 1
sv_allowdownload 1
sv_allowupload 1
sv_maxrate 20000
sv_minrate 5000
mp_timelimit 20
mp_fraglimit 30
mp_falldamage 1
mp_flashlight 1
mp_footsteps 1
mp_weaponstay 0
mp_forcerespawn 0
mp_teamplay 0
decalfrequency 30
log off

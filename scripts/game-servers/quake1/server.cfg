hostname "NSC Retro Fleet Arena (Quake)"
sv_protocolname QUAKE
deathmatch 1
teamplay 0
timelimit 20
fraglimit 30
maxplayers 16
pausable 0
skill 1
sv_public 0
// rcon (fleet convention). DarkPlaces answers "\xff\xff\xff\xffrcon <pw> <cmd>"
// on the game port. The bots are invisible to the server-info query (they are
// not network clients), so this is how you see them:
//   prvm_globalget server bot_count      prvm_edictget server 16 netname
rcon_password "retroadmin"
// Bots: FrikBot X compiled into fbx/progs.dat (scripts/game-servers/quake1/).
// fleet.qc backfills to 3 at skill 2 (Hard). noexit 1: in deathmatch an exit
// trigger otherwise changes the level for everyone, and roaming bots found the
// e1m1 exit within a minute of every map start.
noexit 1

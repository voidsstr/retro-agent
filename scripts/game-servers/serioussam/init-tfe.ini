// NSC Retro Fleet Arena - Serious Sam: The First Encounter dedicated server.
net_iPort = 25600;
gam_iStartMode = 2;             // 2 = fragmatch (deathmatch)
gam_iStartDifficulty = 1;
gam_ctMaxPlayers = 8;
gam_bWaitAllPlayers = 0;
gam_iCredits = 0;
gam_bWeaponsStay = 1;
gam_iTimeLimit = 0;
gam_iFragLimit = 20;

gam_strSessionName = "NSC Retro Fleet Arena (Serious Sam TFE)";
ded_strLevel = "Levels\\Deathmatch\\DesertTemple.wld";
ded_tmTimeout = 20;

// MUST be 0.  With ser_bWaitFirstPlayer = 1 the server sits in a pre-hosting
// wait: the process is up, the log looks fine, and it is not serving.  That is
// exactly the failure this project keeps paying for, so the wait is off and
// the server hosts from the moment it starts.
ser_bWaitFirstPlayer = 0;

// this adjusts initial parameters that will be used for this server

net_iPort = 25610;              // port to run on - change if you want to run more servers on one computer
gam_iStartMode = 2;             // game mode (0=coop, 1=scorematch, 2=fragmatch)
gam_iStartDifficulty = 1;       // difficulty (-1=tourist, 0=easy, 1=normal, 2=hard, 3=serious)
gam_ctMaxPlayers = 8;           // max number of players accepted
gam_bWaitAllPlayers = 0;        // set this to wait for all player to join
gam_iCredits = 0;               // number of credits for respawning
gam_bWeaponsStay = 1;           // weapons stay on/off
gam_iTimeLimit = 0;             // timelimit(minutes) 0=no timelimit
gam_iFragLimit = 20;            // fraglimit

gam_strSessionName = "NSC Retro Fleet Arena (Serious Sam TSE)";
ded_tmTimeout = 20;     // timeout after level is finished
// MUST be 0. With ser_bWaitFirstPlayer = 1 the process is up, the log looks
// fine, and the server is NOT hosting until somebody happens to arrive - the
// exact "reported success" failure this project keeps paying for.
ser_bWaitFirstPlayer = 0;

// TSE runs on 25610 because TFE already holds 25600 AND 25601 (Serious Engine
// opens the port and port+1). A second server on 25601 would have bound
// silently over the first one's second socket.

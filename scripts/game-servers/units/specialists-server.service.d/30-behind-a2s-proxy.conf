# 2026-11-23: TS moved to 27022 behind a2s-proxy-ts (27017 -> 127.0.0.1:27022).
# ReHLDS answers A2S_INFO with a 0x41 challenge the fleet's old GoldSrc clients
# never echo, so TS was invisible in their LAN browser (same as CS/HLDM).
# Players reach it on 27017 through the proxy, so they all arrive from
# 127.0.0.1 - hence sv_rehlds_maxclients_from_single_ip in server.cfg.
[Service]
ExecStart=
ExecStart=/home/voidsstr/hlds-ts/hlds_run -game ts -strictportbind -ip 0.0.0.0 -port 27022 +sv_lan 1 +maxplayers 16 +map ts_lobby +servercfgfile server.cfg

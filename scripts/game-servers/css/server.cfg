// Counter-Strike: Source dedicated server - NSC Retro Fleet
// =========================================================
// The SERVER is Steam app 232330, fetched anonymously from Valve with
// SteamCMD. A dedicated server needs no CS:S licence and costs nothing -
// which is why this exists while none of the CS:S media on the share can be
// staged (all of it is RevEmu-cracked).
//
// sv_lan 1 deliberately: this is a LAN server for the fleet's network, it
// does not register with the Steam master servers and needs no GSLT token.
hostname "NSC Retro Fleet - Counter-Strike Source"
sv_lan 1
sv_region 255
sv_password ""
rcon_password ""

// no VAC on a LAN server, and it cannot reach Valve to enable it anyway
sv_pure 0
sv_consistency 0
sv_allowupload 1
sv_allowdownload 1

mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_footsteps 1
mp_timelimit 20
mp_roundtime 5
mp_freezetime 3
mp_maxrounds 0
mp_autokick 0
sv_alltalk 1

// Extreme MapPack v2 adds 1,066 custom maps to cstrike/maps. They are plain
// community .bsp/.nav content - no executable and no emulator in that
// installer, verified by listing it with innoextract before extracting.
mapcyclefile "mapcycle.txt"

// ------------------------------------------------------------- NSC fleet bots
// CS:S ships its own bots, so no mod is needed here (unlike the 1.6 servers,
// which run YaPB). bot_difficulty scale is 0 easy, 1 normal, 2 HARD, 3 expert -
// it is NOT YaPB's 0..4 scale, so 3 here would be expert, not hard.
// fill = bot_quota is the TOTAL: 3 bots on an empty server, and each human who
// joins replaces one (the fleet convention, same as YaPB fill and Q3 minplayers).
bot_quota 3
bot_quota_mode fill
bot_difficulty 2
bot_join_after_player 0
bot_chatter normal

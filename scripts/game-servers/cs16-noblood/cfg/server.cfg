// CS 1.6 - NO BLOOD server (whitebeast, port 27016)
// Deployed by ../deploy.ps1. Vanilla Counter-Strike rules; the only difference
// from the 27015 server is the noblood AMXX plugin, which drops blood temp
// entities server-side. See ../README.md.

hostname "Retro Fleet CS 1.6 - No Blood"

// sv_lan 1 is what makes this work for the fleet's non-Steam BCS 1.6 clients:
// it turns off Steam authentication entirely. It also keeps the server off the
// public master list, which is what we want - this is a LAN box.
sv_lan 1

sv_password ""
rcon_password "retro-noblood"

// --- vanilla-as-shipped match rules -------------------------------------
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_footsteps 1
mp_flashlight 1
mp_timelimit 20
mp_freezetime 3
mp_roundtime 5
mp_buytime 0.5
mp_startmoney 800
mp_c4timer 45
mp_hostagepenalty 0
mp_forcecamera 0
mp_fadetoblack 0
mp_logmessages 1

// --- rates: LAN, so be generous -----------------------------------------
sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 101
sv_minupdaterate 20
sys_ticrate 1000
sv_timeout 65

sv_cheats 0
sv_consistency 0
sv_allowupload 1
sv_allowdownload 1

// Blood decals are already suppressed at source by the plugin; this just keeps
// bullet-hole decals from piling up on a long-running LAN server.
decalfrequency 30

log on
mp_logdetail 0

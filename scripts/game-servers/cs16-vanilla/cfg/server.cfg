// CS 1.6 - VANILLA server (whitebeast, port 27015)
// Stock Counter-Strike 1.6, no plugins, no mods. This is the reference server
// the retro fleet's BCS 1.6 clients join. See ../../README.md.

hostname "Retro Fleet CS 1.6"

// sv_lan 1 is load-bearing, not a nicety: it disables Steam authentication,
// which is the only reason the fleet's non-Steam BCS 1.6 clients can connect
// at all. It also keeps this box off the public master list.
sv_lan 1

sv_password ""
rcon_password "retro-vanilla"

// --- vanilla-as-shipped match rules -------------------------------------
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0
mp_footsteps 1
mp_flashlight 1
mp_timelimit 20
mp_freezetime 3
mp_roundtime 5
mp_buytime 0.5
mp_startmoney 800
mp_c4timer 45
mp_hostagepenalty 0
mp_forcecamera 0
mp_fadetoblack 0
mp_logmessages 1

// --- rates: LAN, so be generous -----------------------------------------
sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 101
sv_minupdaterate 20
sys_ticrate 1000
sv_timeout 65

sv_cheats 0
sv_consistency 0
sv_allowupload 1
sv_allowdownload 1

decalfrequency 30

log on
mp_logdetail 0

// NSC Retro Fleet Arena - Return to Castle Wolfenstein (ioRTCW 1.51c)
// Retail 1.41 Windows clients join over com_legacyprotocol 60.
set sv_hostname "NSC Retro Fleet Arena (RTCW)"
set rconpassword "retroadmin"
set sv_maxclients 16
set sv_pure 0
set sv_allowDownload 1
set g_motd "NSC Retro Fleet Arena - Return to Castle Wolfenstein"

// 5 = GT_WOLF (objective), 6 = stopwatch, 7 = checkpoint.
// Confirmed from qagame.mp.x86_64.so: "g_gametype %i is out of range,
// defaulting to GT_WOLF(5)".  RTCW MP has NO bots - there is nothing to fill
// an empty server with, so it reads 0/16 until somebody joins.
set g_gametype 5
set timelimit 15
set g_friendlyFire 0
set g_warmup 15

// The id master (wolfmaster.idsoftware.com) is long dead; an unreachable
// master costs a DNS stall every heartbeat and buys nothing on a LAN.
set sv_master1 ""
set sv_master2 ""
set sv_master3 ""
set sv_master4 ""
set sv_master5 ""

// Rotation - all 14 retail 1.41 MP maps.
set d1  "map mp_beach ; set nextmap vstr d2"
set d2  "map mp_castle ; set nextmap vstr d3"
set d3  "map mp_village ; set nextmap vstr d4"
set d4  "map mp_depot ; set nextmap vstr d5"
set d5  "map mp_base ; set nextmap vstr d6"
set d6  "map mp_sub ; set nextmap vstr d7"
set d7  "map mp_destruction ; set nextmap vstr d8"
set d8  "map mp_assault ; set nextmap vstr d9"
set d9  "map mp_ice ; set nextmap vstr d10"
set d10 "map mp_trenchtoast ; set nextmap vstr d11"
set d11 "map mp_keep ; set nextmap vstr d12"
set d12 "map mp_chateau ; set nextmap vstr d13"
set d13 "map mp_tram ; set nextmap vstr d14"
set d14 "map mp_dam ; set nextmap vstr d15"
set d15 "map mp_rocket ; set nextmap vstr d1"
vstr d1
